---
# Single-node k3s from the vendor's install script (get.k3s.io).
#
# Techniques demonstrated:
#   - vendor installer piped to sh, parameterized via environment variables
#     (the curl | sh pattern, wrapped so it is safe to re-run)
#   - idempotence for an imperative installer: resolve the release channel,
#     compare with the installed version, run the installer only on mismatch
#   - declarative runtime config in /etc/rancher/k3s/config.yaml (written
#     before install, restart-on-change) — installer mechanics stay separate
#     from cluster configuration
#   - readiness wait: kubectl wait for node Ready, not just service active
#
# Layer example (RFC-001): the baseline is enforced first, then the layer
# is applied. Run against the local lab: mise run qemu:test:k3s
- name: Enforce the baseline
  ansible.builtin.import_playbook: cur8s.ubuntu.converge

- name: Install single-node k3s
  hosts: all
  remote_user: ansible
  become: true
  gather_facts: false

  vars:
    ansible_ssh_private_key_file: "{{ lookup('ansible.builtin.env', 'ANSIBLE_PUB_KEY') }}"
    k3s_channel: v1.35
    k3s_binary_path: /usr/local/bin/k3s
    # Runtime cluster configuration, declared — not installer flags. k3s
    # reads this at service start; changes require a restart (the handler).
    k3s_config:
      disable:
        - traefik
      write-kubeconfig-mode: "0600"

  tasks:
    - name: Ensure download dependencies are present
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
        state: present

    - name: Ensure k3s configuration directory exists
      ansible.builtin.file:
        path: /etc/rancher/k3s
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Write k3s runtime configuration
      ansible.builtin.copy:
        dest: /etc/rancher/k3s/config.yaml
        owner: root
        group: root
        mode: "0644"
        content: "{{ k3s_config | to_nice_yaml }}"
      notify: Restart k3s

    - name: Read installed k3s version
      ansible.builtin.command: "{{ k3s_binary_path }} --version"
      register: k3s_installed_version_raw
      failed_when: false
      changed_when: false

    - name: Determine installed k3s version
      ansible.builtin.set_fact:
        k3s_installed_version: >-
          {{ k3s_installed_version_raw.stdout_lines[0].split(' ')[2]
             if k3s_installed_version_raw.rc == 0 else '' }}

    # The channel URL 302-redirects to the release tag of its latest version;
    # that redirect is the version authority the installer itself would use.
    - name: Resolve latest k3s version on the channel
      ansible.builtin.uri:
        url: "https://update.k3s.io/v1-release/channels/{{ k3s_channel }}"
        follow_redirects: none
        status_code: 302
      register: k3s_channel_resolve

    - name: Determine channel k3s version
      ansible.builtin.set_fact:
        k3s_channel_version: "{{ k3s_channel_resolve.location | basename | replace('%2B', '+') }}"

    # The vendor's documented install path. Re-running the script updates
    # k3s and restarts the service (pod containers keep running); the
    # version gate above keeps this a no-op when already current.
    - name: Install or update k3s from the vendor installer
      ansible.builtin.shell: curl -sfL https://get.k3s.io | sh -
      environment:
        INSTALL_K3S_CHANNEL: "{{ k3s_channel }}"
      when: k3s_installed_version != k3s_channel_version

    - name: Ensure k3s service is enabled and active
      ansible.builtin.systemd_service:
        name: k3s.service
        enabled: true
        state: started

    - name: Apply pending k3s restart before readiness checks
      ansible.builtin.meta: flush_handlers

    - name: Wait for the node to be Ready
      ansible.builtin.command: "{{ k3s_binary_path }} kubectl wait --for=condition=Ready node --all --timeout=180s"
      changed_when: false

    - name: Validate installed k3s version matches the channel
      ansible.builtin.command: "{{ k3s_binary_path }} --version"
      register: k3s_final_version
      changed_when: false
      failed_when: k3s_channel_version not in k3s_final_version.stdout

  handlers:
    - name: Restart k3s
      ansible.builtin.systemd_service:
        name: k3s.service
        state: restarted
