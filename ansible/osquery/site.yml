---
# osquery from the osquery apt repository, installed for interactive use
# with its daemon deliberately kept off.
#
# Techniques demonstrated:
#   - keyring dance variant (ASCII key -> gpg --dearmor -> .list repo)
#   - installing a package but disabling the daemon it ships: the package
#     is wanted for its interactive tool (osqueryi), not its service
#   - service_facts + asserts to prove the daemon stays down
#
# Layer example (RFC-001): the baseline is enforced first, then the layer
# is applied. Run against the local lab: mise run qemu:test:osquery
- name: Enforce the baseline
  ansible.builtin.import_playbook: cur8s.ubuntu.converge

- name: Install osquery for interactive inspection
  hosts: all
  remote_user: ansible
  become: true
  gather_facts: false

  vars:
    ansible_ssh_private_key_file: "{{ lookup('ansible.builtin.env', 'ANSIBLE_PUB_KEY') }}"

  tasks:
    - name: Ensure apt transport dependencies are present
      ansible.builtin.apt:
        name:
          - ca-certificates
          - gnupg
        state: present

    - name: Ensure apt keyring directory exists
      ansible.builtin.file:
        path: /usr/share/keyrings
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Download osquery signing key
      ansible.builtin.get_url:
        url: https://pkg.osquery.io/deb/pubkey.gpg
        dest: /tmp/osquery-archive-keyring.pub
        owner: root
        group: root
        mode: "0644"
      register: osquery_signing_key

    - name: Check osquery keyring
      ansible.builtin.stat:
        path: /usr/share/keyrings/osquery-archive-keyring.gpg
      register: osquery_keyring

    - name: Trust packages signed by osquery
      ansible.builtin.command:
        cmd: >-
          gpg --dearmor --yes --output
          /usr/share/keyrings/osquery-archive-keyring.gpg
          /tmp/osquery-archive-keyring.pub
      changed_when: osquery_signing_key.changed or not osquery_keyring.stat.exists

    - name: Add osquery apt repository
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/osquery.list
        owner: root
        group: root
        mode: "0644"
        content: |
          deb [arch=amd64,arm64 signed-by=/usr/share/keyrings/osquery-archive-keyring.gpg] https://pkg.osquery.io/deb deb main

    - name: Install osquery for interactive inspection
      ansible.builtin.apt:
        name: osquery
        state: present
        update_cache: true

    - name: Read systemd service facts
      ansible.builtin.service_facts:

    - name: Keep osquery in interactive mode
      ansible.builtin.systemd_service:
        name: osqueryd.service
        enabled: false
        state: stopped
      when: "'osqueryd.service' in ansible_facts.services"

    - name: Refresh service facts after osquery daemon policy
      ansible.builtin.service_facts:

    - name: Assert osquery daemon is not active
      ansible.builtin.assert:
        that:
          - >-
            'osqueryd.service' not in ansible_facts.services
            or ansible_facts.services['osqueryd.service'].state != 'running'
          - >-
            'osqueryd.service' not in ansible_facts.services
            or (ansible_facts.services['osqueryd.service'].status | default('unknown')) != 'enabled'

    - name: Validate osquery interactive command is available
      ansible.builtin.command: osqueryi --version
      changed_when: false
