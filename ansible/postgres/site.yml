---
# PostgreSQL from the PGDG (PostgreSQL Global Development Group) apt
# repository.
#
# Techniques demonstrated:
#   - vendor apt repository as a deb822 .sources file with a Signed-By keyring
#     (PGDG's documented keyring location under /usr/share/postgresql-common)
#   - installing a specific major version of a vendor package
#   - service enable/start plus in-play validation
#
# Layer example (RFC-001): the baseline is enforced first, then the layer
# is applied. Run against the local lab: mise run qemu:test:postgres
- name: Enforce the baseline
  ansible.builtin.import_playbook: cur8s.ubuntu.converge

- name: Install PostgreSQL
  hosts: all
  remote_user: ansible
  become: true
  gather_facts: false

  vars:
    ansible_ssh_private_key_file: "{{ lookup('ansible.builtin.env', 'ANSIBLE_PUB_KEY') }}"
    postgres_version: "18"

  tasks:
    - name: Read dpkg architecture
      ansible.builtin.command: dpkg --print-architecture
      register: dpkg_architecture
      changed_when: false

    - name: Ensure apt transport dependencies are present
      ansible.builtin.apt:
        name:
          - ca-certificates
        state: present

    - name: Ensure PostgreSQL apt keyring directory exists
      ansible.builtin.file:
        path: /usr/share/postgresql-common/pgdg
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Trust packages signed by PostgreSQL Apt Repository
      ansible.builtin.get_url:
        url: https://www.postgresql.org/media/keys/ACCC4CF8.asc
        dest: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
        owner: root
        group: root
        mode: "0644"

    - name: Add PostgreSQL Apt Repository
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/pgdg.sources
        owner: root
        group: root
        mode: "0644"
        content: |
          Types: deb
          URIs: https://apt.postgresql.org/pub/repos/apt
          Suites: noble-pgdg
          Architectures: {{ dpkg_architecture.stdout }}
          Components: main
          Signed-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc

    - name: Install PostgreSQL
      ansible.builtin.apt:
        name: "postgresql-{{ postgres_version }}"
        state: present
        update_cache: true

    - name: Enable and start PostgreSQL
      ansible.builtin.systemd_service:
        name: postgresql.service
        enabled: true
        state: started

    - name: Validate PostgreSQL service is active
      ansible.builtin.command: systemctl is-active postgresql.service
      changed_when: false

    - name: Validate PostgreSQL command is available
      ansible.builtin.command: psql --version
      changed_when: false
