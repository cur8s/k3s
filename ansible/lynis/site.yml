---
# Lynis security auditing tool from the CISOfy apt repository.
#
# Techniques demonstrated:
#   - the classic keyring dance: download an ASCII-armored key, dearmor it
#     into /usr/share/keyrings, reference it from a one-line .list repo
#   - idempotent gpg --dearmor via registered change + keyring stat
#   - a package with no service: install for manual, operator-driven use
#
# Layer example (RFC-001): the baseline is enforced first, then the layer
# is applied. Run against the local lab: mise run qemu:test:lynis
- name: Enforce the baseline
  ansible.builtin.import_playbook: cur8s.ubuntu.converge

- name: Install Lynis for manual audit
  hosts: all
  remote_user: ansible
  become: true
  gather_facts: false

  vars:
    ansible_ssh_private_key_file: "{{ lookup('ansible.builtin.env', 'ANSIBLE_PUB_KEY') }}"

  tasks:
    - name: Ensure apt transport dependencies are present
      ansible.builtin.apt:
        name:
          - ca-certificates
          - gnupg
        state: present

    - name: Ensure apt keyring directory exists
      ansible.builtin.file:
        path: /usr/share/keyrings
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Download CISOfy signing key
      ansible.builtin.get_url:
        url: https://packages.cisofy.com/keys/cisofy-software-public.key
        dest: /tmp/cisofy-software-public.key
        owner: root
        group: root
        mode: "0644"
      register: cisofy_signing_key

    - name: Check CISOfy keyring
      ansible.builtin.stat:
        path: /usr/share/keyrings/cisofy-software-public.gpg
      register: cisofy_keyring

    - name: Trust packages signed by CISOfy
      ansible.builtin.command:
        cmd: >-
          gpg --dearmor --yes --output
          /usr/share/keyrings/cisofy-software-public.gpg
          /tmp/cisofy-software-public.key
      changed_when: cisofy_signing_key.changed or not cisofy_keyring.stat.exists

    - name: Add Lynis apt repository
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/cisofy-lynis.list
        owner: root
        group: root
        mode: "0644"
        content: |
          deb [arch=amd64,arm64 signed-by=/usr/share/keyrings/cisofy-software-public.gpg] https://packages.cisofy.com/community/lynis/deb/ stable main

    - name: Install Lynis for manual audit
      ansible.builtin.apt:
        name: lynis
        state: present
        update_cache: true

    - name: Validate Lynis command is available
      ansible.builtin.command: lynis --version
      changed_when: false
